<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" type="text/css" href="/internal/insets.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KSU Setting</title>
  <script>
    (() => {
      const savedTheme = localStorage.getItem("theme");
      const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = savedTheme === "dark" || savedTheme === "light" ? savedTheme : systemPrefersDark ? "dark" : "light";
      document.documentElement.classList.add(theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
</head>

<body>
  <div id="root">
    <span style="color: gray;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;">
      请稍候...
      <br>
      Please wait...
    </span>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
